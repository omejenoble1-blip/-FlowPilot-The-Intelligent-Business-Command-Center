
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r index.html public/
    - |
      for dir in css js assets images fonts icons; do
        if [ -d "$dir" ]; then
          cp -r "$dir" public/
        fi
      done
    - test -s public/index.html
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
