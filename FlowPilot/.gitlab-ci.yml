
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r index.html public/
    - |
      for dir in css js assets images fonts icons; do
        if [ -d "$dir" ]; then
          cp -r "$dir" public/
        fi
      done
    - |
      if [ ! -s public/index.html ]; then
        echo "ERROR: index.html is missing or empty."
        exit 1
      fi
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
