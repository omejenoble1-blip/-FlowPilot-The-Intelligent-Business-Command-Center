
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp index.html public/index.html
    - |
      for item in css js assets images fonts icons manifest.json 404.html; do
        if [ -e "$item" ]; then
          cp -r "$item" public/
        fi
      done
    - test -s public/index.html
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
